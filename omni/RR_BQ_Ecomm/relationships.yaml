- join_from_view: omni_drive_ai_integration_mypreprod__inventory_items
  join_to_view: omni_drive_ai_integration_mypreprod__products
  join_type: always_left
  on_sql: ${omni_drive_ai_integration_mypreprod__inventory_items.product_id} =
    ${omni_drive_ai_integration_mypreprod__products.id}
  relationship_type: assumed_many_to_one

- join_from_view: omni_drive_ai_integration_mypreprod__order_items
  join_to_view: omni_drive_ai_integration_mypreprod__users
  join_type: always_left
  on_sql: ${omni_drive_ai_integration_mypreprod__order_items.user_id} =
    ${omni_drive_ai_integration_mypreprod__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: omni_drive_ai_integration_mypreprod__order_items
  join_to_view: omni_drive_ai_integration_mypreprod__products
  join_type: always_left
  on_sql: ${omni_drive_ai_integration_mypreprod__order_items.product_id} =
    ${omni_drive_ai_integration_mypreprod__products.id}
  relationship_type: assumed_many_to_one

- join_from_view: omni_drive_ai_integration_mypreprod__order_items
  join_to_view: omni_drive_ai_integration_mypreprod__inventory_items
  join_type: always_left
  on_sql: ${omni_drive_ai_integration_mypreprod__order_items.inventory_item_id} =
    ${omni_drive_ai_integration_mypreprod__inventory_items.id}
  relationship_type: assumed_many_to_one

- join_from_view: omni_drive_ai_integration_mypreprod__products
  join_to_view: omni_drive_ai_integration_mypreprod__distribution_centers
  join_type: always_left
  on_sql: ${omni_drive_ai_integration_mypreprod__products.distribution_center_id}
    = ${omni_drive_ai_integration_mypreprod__distribution_centers.id}
  relationship_type: assumed_many_to_one
